# Render Blueprint - deploys the same always-on Node server this app used
# on Railway. Render's FREE web service plan doesn't support persistent
# disks at all (only paid plans do) - so instead of a mounted volume, the
# JSON "database" (server/server.js) is backed by Upstash's free-forever
# Redis via its REST API when UPSTASH_REDIS_REST_URL/TOKEN are set (see
# that file's storage-layer comment). Connect this repo in the Render
# dashboard (New -> Blueprint) and Render will read this file and
# provision the service automatically - the three things it can't fill in
# for you (marked sync: false) are GEMINI_API_KEY and the two Upstash
# credentials, which you paste in once during setup:
#   1. Create a free database at https://console.upstash.com (Redis,
#      "Regional" type - the free tier needs no credit card).
#   2. Copy its REST URL and REST TOKEN from that database's page.
#   3. Paste those two plus your Gemini key in when Render prompts.
services:
  - type: web
    name: blitz-planogram-planner
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: "echo 'No build step - zero npm dependencies'"
    startCommand: "node server/server.js"
    healthCheckPath: /api/vision-status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
